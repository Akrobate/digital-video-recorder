[project]
name = "digital-video-recorder"
version = "1.0.0"
description = "Enregistreur vidéo pour webcams et cartes d'acquisition USB (V4L2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=14",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyqt5>=5.15",
]

[project.scripts]
dvr = "dvr.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dvr"]
